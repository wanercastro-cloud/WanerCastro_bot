name: CI/CD – Deploy to Railway

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install flake8 && flake8 . --exit-zero --max-line-length=120
        continue-on-error: true
      - run: |
          if [ -d "tests" ]; then pip install pytest && pytest --tb=short; fi

  deploy:
    name: Trigger Railway Deploy
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Redeploy no Railway
        run: |
          curl --fail -X POST \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"query":"mutation { serviceInstanceRedeploy(serviceId: \"${{ secrets.RAILWAY_SERVICE_ID }}\") }"}' \
            https://backboard.railway.app/graphql/v2
